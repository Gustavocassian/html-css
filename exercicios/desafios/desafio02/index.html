<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags em HTML5</title>
</head>
<body>
    <h1>Tags em HTML</h1>
        <p>Em HTML5, podemos inserir os elementos da lista a seguir, Passe o mouse<br>sobre os termos para descobrir qual tag deverá utilizar em cada caso.</p>
        <ul type="square">
            <li><abbr title="Use a tag <p> para">Parágrafo</abbr></li>
            <li><abbr title="Use a tag: <h1,h2,h3,h4,h5 ou h6 para">títulos</abbr></li>
            <li><abbr title="Use a tag: <Img> para">imagens</abbr></li>
            <li><abbr title="Use a tag <abbr> para">abreviações</abbr></li>
            <li><abbr title="Use a tag <code> para">código fonte</abbr></li>
            <li><abbr title="Use a tag <ol> para">Listas numeradas</abbr></li>
            <li> <abbr title="Use a tag <ul> ">Listas com demarcadores</abbr></li>
        </ul>
</body>
</html>
