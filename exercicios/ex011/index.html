<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML5</title>
</head>
<body>
    <h1>imagem dinamica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes, ou simplesmente aumente e diminua o tamanho do seu navegador</p>

    <picture>

        <source media="(max-width: 750px )" srcset="imagens/fotop.png" type="image/png">
        <!--A ordem das imagem importa -->
       <source media="(max-width:  1075px )" srcset="imagens/fotom.png" type="image/png">
        <!--Max width = mas se menor que 1075px, carrega a foto M -->
        <img src="imagens/fotog.png" alt="foto grande, flexivel">
    </picture>
    
    <h1>Reproduzindo áudio</h1>
    <p>Agora vamos reproduzir um audio em HTML5
    </p>
    <audio src="midias/teste.mp3" controls>
    </audio> 

</body>
</html>
