<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
    <style>

        /*
            # = id
            . = class
            : = psuedo-class
            :: = Psuedo-elementos
            > = clindren
        
        */
        body{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        a{
            color: cornflowerblue;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover{
        color: black;
        text-decoration: underline;
        }

        a:active{
            color: rgb(55, 80, 128);
        }

        a::after{
            content: '[link]';
            text-decoration: none;
            font-weight: normal;
            color: darkgrey;
        }
    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://gustavoguanabara.github.io" target="_blank" rel="external">repositório GitHub</a>
        </li>
        <li><a href="https://www.youtube.com/@cursoemvideo" target="_blank" rel="external">Canal You Tube</a>
        </li>
        <li><a href="https://www.cursoemvideo.com/" target="_blank" rel="external">Site Cursoemvideo</a>
        </li>
    </ul>
</body>
</html>
